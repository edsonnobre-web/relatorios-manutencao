name: Gerar APK TechReport

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-twa/**'
      - '.github/workflows/android-build.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Mostrar versões
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Compilar APK de teste
        working-directory: android-twa
        run: gradle :app:assembleDebug --stacktrace --info

      - name: Localizar APK
        run: |
          mkdir -p build-output
          cp android-twa/app/build/outputs/apk/debug/app-debug.apk build-output/TechReport-1.0.0-test2.apk

      - name: Gerar impressão digital do APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs build-output/TechReport-1.0.0-test2.apk > build-output/fingerprint.txt
          cat build-output/fingerprint.txt

      - name: Enviar APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TechReport-APK-Teste
          path: build-output/
          retention-days: 30
